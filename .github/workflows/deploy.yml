name: Deploy

on:
  push:
    tags: ['*']

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: rg.pl-waw.scw.cloud/namespace-nostalgic-goodall
  IMAGE_NAME: stdout.me

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Scaleway registry
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: docker login "$REGISTRY" -u nologin --password-stdin <<< "$SCW_SECRET_KEY"

      - name: Build image
        run: |
          docker build \
            -t "$REGISTRY/$IMAGE_NAME:$GITHUB_REF_NAME" \
            -t "$REGISTRY/$IMAGE_NAME:latest" \
            .

      - name: Push image
        run: |
          docker push "$REGISTRY/$IMAGE_NAME:$GITHUB_REF_NAME"
          docker push "$REGISTRY/$IMAGE_NAME:latest"

      - name: Log out of registry
        if: always()
        run: docker logout "$REGISTRY"
